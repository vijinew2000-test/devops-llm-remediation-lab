---
- name: Investigate service down
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Collect service down evidence
      ansible.builtin.shell: |
        set -o pipefail
        systemctl --no-pager --full status {{ target_service | quote }}
      args:
        executable: /bin/bash
      register: investigation
      changed_when: false
      failed_when: false

    - name: Show sanitized evidence
      ansible.builtin.debug:
        var: investigation.stdout_lines
