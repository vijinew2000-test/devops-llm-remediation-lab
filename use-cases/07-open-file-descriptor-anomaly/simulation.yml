---
- name: Simulate Open File Descriptor Anomaly
  hosts: all
  become: yes
  gather_facts: no

  vars:
    fd_count: 800
    simulator_script: "/tmp/ofd_simulator.sh"
    pid_file: "/tmp/ofd_simulator.pid"

  tasks:

    - name: Stop previous simulator if running
      ansible.builtin.shell: |
        if [ -f "{{ pid_file }}" ]; then
          old_pid=$(cat "{{ pid_file }}")
          kill "$old_pid" 2>/dev/null || true
        fi
        rm -f "{{ pid_file }}"
      changed_when: false

    - name: Create OFD simulator script
      ansible.builtin.copy:
        dest: "{{ simulator_script }}"
        mode: "0755"
        content: |
          #!/bin/bash

          FD_COUNT={{ fd_count }}

          # Record PID before opening descriptors
          echo $$ > "{{ pid_file }}"

          # Open many file descriptors
          for i in $(seq 1 "$FD_COUNT"); do
              eval "exec $((10 + i))<>/dev/null"
          done

          # Keep descriptors open
          while true; do
              sleep 60
          done

    - name: Start OFD simulator
      ansible.builtin.shell:
        cmd: "nohup {{ simulator_script }} >/tmp/ofd_simulator.log 2>&1 &"
      async: 5
      poll: 0

    - name: Wait for PID file
      ansible.builtin.wait_for:
        path: "{{ pid_file }}"
        timeout: 10

    - name: Read simulator PID
      ansible.builtin.slurp:
        src: "{{ pid_file }}"
      register: simulator_pid_raw

    - name: Set simulator PID
      ansible.builtin.set_fact:
        simulator_pid: "{{ simulator_pid_raw.content | b64decode | trim }}"

    - name: Check simulator is running
      ansible.builtin.command:
        cmd: "kill -0 {{ simulator_pid }}"
      changed_when: false

    - name: Check simulator FD count
      ansible.builtin.shell:
        cmd: "ls /proc/{{ simulator_pid }}/fd 2>/dev/null | wc -l"
      register: simulator_fd_count
      changed_when: false

    - name: Display simulation result
      ansible.builtin.debug:
        msg:
          - "OPEN FILE DESCRIPTOR SIMULATION COMPLETED"
          - "Simulator PID: {{ simulator_pid }}"
          - "FDs opened: {{ simulator_fd_count.stdout }}"
          - "Use this PID as input to the remediation playbook."
