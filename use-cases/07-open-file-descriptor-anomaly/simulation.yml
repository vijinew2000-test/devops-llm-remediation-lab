---
- name: Simulate Open File Descriptor Anomaly
  hosts: all
  become: yes
  gather_facts: no

  tasks:

    - name: Create OFD simulator
      ansible.builtin.copy:
        dest: /tmp/ofd_simulator.py
        mode: "0755"
        content: |
          import time

          files = []

          for i in range(300):
              files.append(open("/dev/null", "r"))

          while True:
              time.sleep(60)

    - name: Start OFD simulator
      ansible.builtin.shell:
        cmd: "nohup python3 /tmp/ofd_simulator.py >/tmp/ofd_simulator.log 2>&1 &"
      changed_when: true

    - name: Wait for simulator
      ansible.builtin.pause:
        seconds: 2

    - name: Find simulator PID
      ansible.builtin.shell:
        cmd: "pgrep -f '/tmp/ofd_simulator.py' | head -1"
      register: simulator_pid
      changed_when: false

    - name: Show simulation result
      ansible.builtin.shell:
        cmd: "ls /proc/{{ simulator_pid.stdout }}/fd | wc -l"
      register: simulator_fd_count
      changed_when: false

    - name: Display result
      ansible.builtin.debug:
        msg:
          - "OFD SIMULATION CREATED"
          - "PID: {{ simulator_pid.stdout }}"
          - "Process: /tmp/ofd_simulator.py"
          - "Open FDs: {{ simulator_fd_count.stdout }}"
