---
- name: Open File Descriptor Remediation
  hosts: all
  become: yes
  gather_facts: no

  vars:
    remediation_pid: ""

  tasks:

    - name: Validate remediation PID
      ansible.builtin.assert:
        that:
          - remediation_pid | string | length > 0
          - remediation_pid | string is match('^[0-9]+$')
        fail_msg: "Provide remediation_pid from the investigation output."

    - name: Get process information
      ansible.builtin.shell:
        cmd: "ps -p {{ remediation_pid }} -o pid=,comm=,args="
      register: process_info
      changed_when: false

    - name: Verify this is the OFD simulator
      ansible.builtin.assert:
        that:
          - "'ofd_simulator.py' in process_info.stdout"
        fail_msg: >
          PID {{ remediation_pid }} is not the expected OFD simulator.
          Remediation stopped for safety.

    - name: Get FD count before remediation
      ansible.builtin.shell:
        cmd: "ls /proc/{{ remediation_pid }}/fd 2>/dev/null | wc -l"
      register: fd_before
      changed_when: false

    - name: Stop OFD simulator
      ansible.builtin.command:
        cmd: "kill {{ remediation_pid }}"

    - name: Wait for process to stop
      ansible.builtin.pause:
        seconds: 2

    - name: Verify process was stopped
      ansible.builtin.shell:
        cmd: "ps -p {{ remediation_pid }} -o pid=,comm="
      register: process_after
      changed_when: false
      failed_when: false

    - name: Validate remediation
      ansible.builtin.assert:
        that:
          - process_after.stdout | trim == ""
        success_msg: "OFD remediation successful. Simulator process was stopped."
        fail_msg: "OFD remediation failed. Process is still running."

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "OFD REMEDIATION COMPLETED"
          - "PID: {{ remediation_pid }}"
          - "FD count before remediation: {{ fd_before.stdout }}"
          - "Process stopped successfully."
          - "Open file descriptor anomaly caused by the simulator has been removed."
