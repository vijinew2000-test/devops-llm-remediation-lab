---
- name: Process Remediation
  hosts: all
  become: yes
  gather_facts: no

  vars:
    remediation_pid: ""

  tasks:

    - name: Validate remediation PID
      ansible.builtin.assert:
        that:
          - remediation_pid | string | length > 0
          - remediation_pid | string is match('^[0-9]+$')
        fail_msg: "Provide a valid process PID using -e remediation_pid=<PID>"

    - name: Get process information
      ansible.builtin.shell:
        cmd: "ps -p {{ remediation_pid }} -o pid=,user=,comm=,args="
      register: process_info
      changed_when: false

    - name: Display process to be remediated
      ansible.builtin.debug:
        msg: "{{ process_info.stdout }}"

    - name: Check that process exists
      ansible.builtin.assert:
        that:
          - process_info.stdout | trim != ""
        fail_msg: "PID {{ remediation_pid }} is not running."

    - name: Get FD count before remediation
      ansible.builtin.shell:
        cmd: "ls /proc/{{ remediation_pid }}/fd 2>/dev/null | wc -l"
      register: fd_before
      changed_when: false
      failed_when: false

    - name: Stop process
      ansible.builtin.command:
        cmd: "kill {{ remediation_pid }}"

    - name: Wait for process to stop
      ansible.builtin.pause:
        seconds: 2

    - name: Verify process was stopped
      ansible.builtin.shell:
        cmd: "ps -p {{ remediation_pid }} -o pid=,comm="
      register: process_after
      changed_when: false
      failed_when: false

    - name: Validate remediation
      ansible.builtin.assert:
        that:
          - process_after.stdout | trim == ""
        success_msg: "Process {{ remediation_pid }} was stopped successfully."
        fail_msg: "Process {{ remediation_pid }} is still running."

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "PROCESS REMEDIATION COMPLETED"
          - "PID: {{ remediation_pid }}"
          - "FD count before remediation: {{ fd_before.stdout }}"
          - "Process stopped successfully."
