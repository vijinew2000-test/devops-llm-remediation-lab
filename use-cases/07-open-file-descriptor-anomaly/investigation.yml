---
- name: Open File Descriptor Investigation
  hosts: all
  become: yes
  gather_facts: no

  vars:
    top_processes: 10

  tasks:

    - name: Get system-wide file descriptor usage
      ansible.builtin.command:
        cmd: cat /proc/sys/fs/file-nr
      register: file_nr
      changed_when: false

    - name: Get maximum allowed file descriptors
      ansible.builtin.command:
        cmd: cat /proc/sys/fs/file-max
      register: file_max
      changed_when: false

    - name: Find processes with highest FD count
      ansible.builtin.shell: |
        for pid in /proc/[0-9]*; do
          pid_num=$(basename "$pid")

          if [ -d "$pid/fd" ]; then
            fd_count=$(ls "$pid/fd" 2>/dev/null | wc -l)
            process_name=$(cat "$pid/comm" 2>/dev/null || echo "unknown")

            echo "$fd_count $pid_num $process_name"
          fi
        done 2>/dev/null \
        | sort -nr \
        | head -n {{ top_processes }}
      register: top_fd_processes
      changed_when: false

    - name: Get current system FD usage percentage
      ansible.builtin.shell: |
        read allocated unused max_allocated < /proc/sys/fs/file-nr
        max=$(cat /proc/sys/fs/file-max)

        if [ "$max" -gt 0 ]; then
          awk "BEGIN {printf \"%.2f\", ($allocated / $max) * 100}"
        else
          echo "0"
        fi
      register: fd_usage_percent
      changed_when: false

    - name: Display OFD investigation result
      ansible.builtin.debug:
        msg:
          investigation_type: "open_file_descriptors"
          system_file_nr: "{{ file_nr.stdout }}"
          file_max: "{{ file_max.stdout }}"
          system_fd_usage_percent: "{{ fd_usage_percent.stdout }}"
          top_fd_processes: "{{ top_fd_processes.stdout_lines }}"
