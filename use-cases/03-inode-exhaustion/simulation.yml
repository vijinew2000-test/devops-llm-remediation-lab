---
- name: Simulate Inode Exhaustion
  hosts: all
  become: yes
  gather_facts: no

  vars:
    test_dir: "/tmp/inode-exhaustion-test"
    file_count: 100000

  tasks:

    - name: Remove previous test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: absent

    - name: Create test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: "0755"

    - name: Create test files
      ansible.builtin.shell: |
        for i in $(seq 1 {{ file_count }}); do
          touch "{{ test_dir }}/test_$i"
        done
      args:
        executable: /bin/bash

    - name: Count created files
      ansible.builtin.shell:
        cmd: "find {{ test_dir }} -type f | wc -l"
      register: test_file_count
      changed_when: false

    - name: Check inode usage
      ansible.builtin.command:
        cmd: df -P -i /
      register: inode_usage
      changed_when: false

    - name: Display simulation result
      ansible.builtin.debug:
        msg:
          - "INODE SIMULATION COMPLETED"
          - "Test directory: {{ test_dir }}"
          - "Files created: {{ test_file_count.stdout }}"
          - "Current inode usage:"
          - "{{ inode_usage.stdout }}"
