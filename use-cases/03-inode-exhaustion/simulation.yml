---
- name: Simulate inode exhaustion safely
  hosts: lab
  gather_facts: false
  vars:
    allow_simulation: false
  tasks:
    - name: Require explicit lab opt-in
      ansible.builtin.assert:
        that:
          - allow_simulation | bool
          - inventory_hostname in groups['lab']
        fail_msg: "Blocked: simulations may run only on hosts in the lab group with allow_simulation=true."

    - name: Simulation integration point
      ansible.builtin.debug:
        msg: "Create small test files only inside an explicitly supplied lab directory."
