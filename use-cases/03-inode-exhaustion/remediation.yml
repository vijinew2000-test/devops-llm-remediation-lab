---
- name: Approved inode exhaustion remediation
  hosts: all
  gather_facts: false
  become: true
  vars:
    allow_remediation: false
  tasks:
    - name: Require explicit human approval
      ansible.builtin.assert:
        that:
          - allow_remediation | bool
        fail_msg: "Blocked: set allow_remediation=true only after reviewing the target and rollback plan."

    - name: Remediation integration point
      ansible.builtin.debug:
        msg: "Remove files only through a reviewed retention policy scoped to a lab or approved path."
